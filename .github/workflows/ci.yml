name: API Automation CI

# 什么时候触发：push到main分支，或PR到main分支
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 设置 Pages 的部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同时只运行一个部署任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 定义一个Job叫 api-test
  api-test:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 在Ubuntu虚拟机上跑（免费）
    runs-on: ubuntu-latest

    steps:
      # Step 1: 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 保留 JDK，因为 Allure 生成报告需要 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 2: 安装Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Step 3: 安装uv（你用的包管理器）
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Step 4: 安装项目依赖
      - name: Install dependencies
        run: uv sync

      # Step 5: 后台启动Flask后端，并等待就绪
      - name: Start Flask backend
        run: |
          uv run app.py &
          sleep 3
          echo "检查后端是否启动..."
          curl -s http://127.0.0.1:5000/api/users || exit 1
          echo "后端就绪！"

      # Step 6: 运行Pytest + Allure
      - name: Run tests
        run: uv run pytest Web_Automation/test_shop_po.py -v --alluredir=./allure-results

      # 加载历史报告数据，用于生成趋势图
      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 生成 Allure 报告
      - name: Build test report
        uses: simple-elf/allure-report-action@v1.8
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      # 发布报告到 GitHub Pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # # Step 7: 安装Allure命令行（用npm装最快）
      # - name: Install Allure CLI
      #   run: npm install -g allure-commandline

      # # Step 8: 生成HTML报告
      # - name: Generate Allure Report
      #   run: allure generate ./allure-results -o ./allure-report --clean

      # # Step 9: 上传报告为Artifact（可下载查看）
      # - name: Upload Allure Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: allure-report
      #     path: ./allure-report
      #     retention-days: 30